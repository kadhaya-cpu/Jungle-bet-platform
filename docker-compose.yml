services:
  postgres:
    image: postgres:16-alpine
    container_name: junglebet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trafficuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
      POSTGRES_DB: ${POSTGRES_DB:-trafficracer_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trafficuser} -d ${POSTGRES_DB:-trafficracer_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - junglebet-net

  redis:
    image: redis:7-alpine
    container_name: junglebet-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - junglebet-net

volumes:
  postgres_data:
    name: junglebet_postgres_data
  redis_data:
    name: junglebet_redis_data

networks:
  junglebet-net:
    driver: bridge
