# ==============================================================================
# RUSH HOUR BET - Railway Backend Service Deployment Configuration
# ==============================================================================
"$schema" = "https://railway.com/railway.schema.json"

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000} --workers 2"
healthcheckPath = "/health"
healthcheckTimeout = 15
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# ==============================================================================
# Backend Service Configuration (root directory, uvicorn)
# ==============================================================================
[services.backend]
name = "backend"
service = "backend"
type = "web"
description = "Backend (root, uvicorn)"
root = "."
rootDirectory = "."
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
command = "uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000} --workers 2"
startCommand = "uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000} --workers 2"
healthcheckPath = "/health"
healthcheckTimeout = 15
restartPolicyType = "ON_FAILURE"
port = 8000

# Top-level backend table alias
[backend]
name = "backend"
description = "Backend (root, uvicorn)"
root = "."
rootDirectory = "."
command = "uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000} --workers 2"
startCommand = "uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000} --workers 2"
port = 8000
healthcheckPath = "/health"
